# AI 블로그 포스트 토픽 큐
#
# blog-post 스킬이 읽어서 status: todo 인 항목을 위에서부터 꺼내 쓴다.
# 이 디렉토리는 `.` 로 시작하므로 Jekyll 빌드에서 자동 제외된다 (사이트에 노출 안 됨).
#
# status: todo | writing | done
# done 이 되면 published(YYYY-MM-DD) 와 post(파일명) 를 채운다.
#
# 축이 둘이다 (2026-08-10 재편). category = 글의 종류, prefix = 기술 분야.
# 제목은 "[{prefix}] {title}" 형태가 된다.
#
#   category   글의 종류                     주로 쓰는 prefix
#   ─────────────────────────────────────────────────────────────────────
#   AI         AI 개념·용어·활용 팁          LLM, Prompt, Agent, API, Tool, IDE, Vision
#   Paper      논문 리뷰                     VLM, Time Series, Agent, LLM
#   Review     레포·도구·모델 리뷰           Agent, IDE, Tool, Model
#   Dev        언어·라이브러리·오류 해결     Python, SQL, Node.js
#   Infra      서버·환경·GPU·리눅스          Linux, Bash, Server, CUDA
#
# 이 5개 외에 새 카테고리를 만들지 않는다. 새 주제는 prefix 를 새로 만든다.
# 같은 prefix 가 여러 category 에 걸치는 건 의도된 것 — [Agent] 는 Review 와 Paper 양쪽에 붙어
# 두 글이 한 주제라는 걸 드러낸다.
#
# ══════════════════════════════════════════════════════════════════════
# ⚠️ 블로그가 둘이다 (2026-08-14 분리). 여기서 뽑기 전에 반드시 읽을 것.
# ══════════════════════════════════════════════════════════════════════
#
# LLM·에이전트·프롬프트 주제는 junhyunp.github.io 로 넘어갔다.
# 이 큐의 아래쪽 LLM/Prompt/Tool/IDE/Agent 항목들은 **그쪽 몫**이고,
# 여기서 꺼내 쓰면 같은 글이 두 도메인에 올라간다 (중복 콘텐츠).
#
#   junhyunp.github.io  →  LLM · Agent · Prompt · 최신 논문 · 트렌드
#   여기 (CodersBlog)   →  아래 표대로
#
# 그리고 이 블로그는 2인 블로그다. 영역이 갈린다.
#
#   작성자        영역                              대표 글
#   ──────────────────────────────────────────────────────────────────
#   sehoon-lee   비전·VLM, Infra(Linux/CUDA/       BLIP, CLIP-Adapter, Tip-Adapter,
#                TensorRT/Server)                  VideoCLIP, DINOv3, TensorRT-LLM
#   Junhyuns     Time Series, Python·Pandas 실무,  TS Survey, SegRNN, 시계열 전처리,
#                SQL                               csv 병합, 각종 오류 해결, SQL
#
# → Junhyuns 가 이 큐에서 꺼내 쓸 것은 [Time Series] · [Python] · [SQL] 이다.
#   비전·VLM·Infra 주제는 sehoon-lee 영역이므로 먼저 상의한다.
#   이미 발행된 글 목록을 `ls _posts` 로 확인하고, 같은 날 같은 분야가 겹치지 않게 한다.
#
# status 에 `moved` 가 붙은 항목은 junhyunp.github.io 에서 이미 발행됐다. 쓰지 않는다.

