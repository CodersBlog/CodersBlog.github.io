<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" role="img" aria-labelledby="title desc">
  <title id="title">원격 브랜치와 로컬 브랜치가 갈라져 push가 거절되는 그래프</title>
  <desc id="desc">공통 커밋 B에서 로컬 C, D와 원격 E가 갈라져 있습니다. 로컬 push는 원격의 E를 건너뛰기 때문에 거절됩니다.</desc>
  <defs>
    <marker id="arrow-push" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d86565"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#16324f" flood-opacity=".10"/></filter>
  </defs>
  <rect x="12" y="12" width="936" height="346" rx="22" fill="#f7f9fc" stroke="#e3e9f2"/>
  <text x="48" y="56" font-family="Arial,'Malgun Gothic',sans-serif" font-size="19" font-weight="700" fill="#21324a">원격과 로컬이 서로 다른 커밋을 가리키면 push가 멈춥니다</text>
  <text x="48" y="82" font-family="Arial,'Malgun Gothic',sans-serif" font-size="13" fill="#728096">Git은 원격 E를 건너뛰어 덮어쓰지 않도록 non-fast-forward push를 거절합니다.</text>
  <path d="M158 210H335" fill="none" stroke="#93a1b3" stroke-width="5" stroke-linecap="round"/>
  <path d="M335 210C390 210 397 132 462 132H650" fill="none" stroke="#5367c8" stroke-width="5" stroke-linecap="round"/>
  <path d="M335 210C390 210 397 282 462 282H650" fill="none" stroke="#17877c" stroke-width="5" stroke-linecap="round"/>
  <path d="M650 132C738 132 750 210 823 210" fill="none" stroke="#d86565" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#arrow-push)"/>
  <g filter="url(#shadow)">
    <circle cx="158" cy="210" r="26" fill="#fff" stroke="#8796a9" stroke-width="4"/><circle cx="335" cy="210" r="26" fill="#fff" stroke="#8796a9" stroke-width="4"/>
    <circle cx="462" cy="132" r="26" fill="#fff" stroke="#5367c8" stroke-width="4"/><circle cx="650" cy="132" r="26" fill="#fff" stroke="#5367c8" stroke-width="4"/>
    <circle cx="462" cy="282" r="26" fill="#fff" stroke="#17877c" stroke-width="4"/><circle cx="650" cy="282" r="26" fill="#fff" stroke="#17877c" stroke-width="4"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#26364b"><text x="158" y="215">A</text><text x="335" y="215">B</text><text x="462" y="137">C</text><text x="650" y="137">D</text><text x="650" y="287">E</text></g>
  <rect x="708" y="101" width="144" height="34" rx="17" fill="#e9ecff"/><text x="780" y="123" font-family="Arial,'Malgun Gothic',sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#4557b4">내 로컬 브랜치</text>
  <rect x="708" y="263" width="176" height="34" rx="17" fill="#e3f5f1"/><text x="796" y="285" font-family="Arial,'Malgun Gothic',sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#14766e">origin/feature/…</text>
  <rect x="742" y="157" width="170" height="34" rx="17" fill="#fff0ed" stroke="#f3c8c1"/><text x="827" y="179" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#b84d4d">push rejected</text>
  <text x="48" y="330" font-family="Arial,'Malgun Gothic',sans-serif" font-size="12" fill="#728096">먼저 fetch한 뒤 두 갈래를 rebase 또는 merge로 통합하고 push합니다.</text>
</svg>
