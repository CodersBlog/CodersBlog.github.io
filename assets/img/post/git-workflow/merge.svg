<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">merge 전후의 브랜치 그래프</title>
  <desc id="desc">왼쪽에서 main과 기능 브랜치가 갈라져 있고, 오른쪽에서 merge 커밋 M이 두 흐름을 합칩니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8391a4"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#16324f" flood-opacity=".10"/></filter>
  </defs>
  <rect x="12" y="12" width="1076" height="476" rx="22" fill="#f7f9fc" stroke="#e3e9f2"/>
  <text x="48" y="56" font-family="Arial,'Malgun Gothic',sans-serif" font-size="19" font-weight="700" fill="#21324a">merge는 갈라진 두 이력을 merge 커밋으로 연결합니다</text>
  <rect x="42" y="82" width="455" height="360" rx="18" fill="#fff" stroke="#e5eaf1"/>
  <rect x="603" y="82" width="455" height="360" rx="18" fill="#fff" stroke="#e5eaf1"/>
  <text x="70" y="120" font-family="Arial,'Malgun Gothic',sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#7a8798">MERGE 전</text>
  <text x="631" y="120" font-family="Arial,'Malgun Gothic',sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#7a8798">MERGE 후</text>
  <path d="M120 282H260M260 282H390" fill="none" stroke="#17877c" stroke-width="5" stroke-linecap="round"/>
  <path d="M260 282C294 282 292 205 340 205H390" fill="none" stroke="#5367c8" stroke-width="5" stroke-linecap="round"/>
  <path d="M681 282H795M795 282H905" fill="none" stroke="#17877c" stroke-width="5" stroke-linecap="round"/>
  <path d="M905 282H982" fill="none" stroke="#e59a42" stroke-width="5" stroke-linecap="round"/>
  <path d="M795 282C822 282 817 205 854 205H905" fill="none" stroke="#5367c8" stroke-width="5" stroke-linecap="round"/>
  <path d="M905 205C946 205 947 282 982 282" fill="none" stroke="#5367c8" stroke-width="5" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <circle cx="120" cy="282" r="24" fill="#fff" stroke="#8796a9" stroke-width="4"/><circle cx="260" cy="282" r="24" fill="#fff" stroke="#8796a9" stroke-width="4"/>
    <circle cx="340" cy="205" r="24" fill="#fff" stroke="#5367c8" stroke-width="4"/><circle cx="390" cy="205" r="24" fill="#fff" stroke="#5367c8" stroke-width="4"/><circle cx="390" cy="282" r="24" fill="#fff" stroke="#17877c" stroke-width="4"/>
    <circle cx="681" cy="282" r="24" fill="#fff" stroke="#8796a9" stroke-width="4"/><circle cx="795" cy="282" r="24" fill="#fff" stroke="#8796a9" stroke-width="4"/><circle cx="854" cy="205" r="24" fill="#fff" stroke="#5367c8" stroke-width="4"/><circle cx="905" cy="205" r="24" fill="#fff" stroke="#5367c8" stroke-width="4"/><circle cx="905" cy="282" r="24" fill="#fff" stroke="#17877c" stroke-width="4"/><circle cx="982" cy="282" r="27" fill="#fff" stroke="#e59a42" stroke-width="5"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#26364b"><text x="120" y="287">A</text><text x="260" y="287">B</text><text x="340" y="210">C</text><text x="390" y="210">D</text><text x="390" y="287">E</text><text x="681" y="287">A</text><text x="795" y="287">B</text><text x="854" y="210">C</text><text x="905" y="210">D</text><text x="905" y="287">E</text><text x="982" y="287">M</text></g>
  <rect x="358" y="318" width="70" height="28" rx="14" fill="#e3f5f1"/><text x="393" y="337" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#14766e">main</text>
  <rect x="334" y="154" width="145" height="28" rx="14" fill="#e9ecff"/><text x="406" y="173" font-family="Arial,'Malgun Gothic',sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#4557b4">feature/search</text>
  <rect x="870" y="318" width="70" height="28" rx="14" fill="#e3f5f1"/><text x="905" y="337" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#14766e">main</text>
  <rect x="942" y="232" width="108" height="28" rx="14" fill="#e9ecff"/><text x="996" y="251" font-family="Arial,'Malgun Gothic',sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#4557b4">feature</text>
  <path d="M520 260H575" stroke="#8391a4" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="70" y="388" font-family="Arial,'Malgun Gothic',sans-serif" font-size="12" fill="#728096">main은 E까지 전진</text>
  <text x="631" y="388" font-family="Arial,'Malgun Gothic',sans-serif" font-size="12" fill="#728096">M이 E와 D를 부모로 연결</text>
  <text x="631" y="412" font-family="Arial,'Malgun Gothic',sans-serif" font-size="12" fill="#728096">기능 브랜치가 M을 가리킵니다</text>
