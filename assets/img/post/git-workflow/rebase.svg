<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">rebase 전후의 커밋 그래프</title>
  <desc id="desc">기능 커밋 C와 D가 main의 최신 커밋 E 위에 새 커밋 C 프라임과 D 프라임으로 다시 적용됩니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8391a4"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#16324f" flood-opacity=".10"/></filter>
  </defs>
  <rect x="12" y="12" width="1076" height="476" rx="22" fill="#f7f9fc" stroke="#e3e9f2"/>
  <text x="48" y="56" font-family="Arial,'Malgun Gothic',sans-serif" font-size="19" font-weight="700" fill="#21324a">rebase는 기능 커밋을 최신 main 위에 다시 적용합니다</text>
  <rect x="42" y="82" width="455" height="360" rx="18" fill="#fff" stroke="#e5eaf1"/>
  <rect x="603" y="82" width="455" height="360" rx="18" fill="#fff" stroke="#e5eaf1"/>
  <text x="70" y="120" font-family="Arial,'Malgun Gothic',sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#7a8798">REBASE 전</text>
  <text x="631" y="120" font-family="Arial,'Malgun Gothic',sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#7a8798">REBASE 후</text>
  <path d="M105 286H236M236 286H382" fill="none" stroke="#17877c" stroke-width="5" stroke-linecap="round"/>
  <path d="M236 286C271 286 268 205 318 205H382" fill="none" stroke="#5367c8" stroke-width="5" stroke-linecap="round"/>
  <path d="M666 286H770M770 286H860" fill="none" stroke="#17877c" stroke-width="5" stroke-linecap="round"/>
  <path d="M860 286H956H1030" fill="none" stroke="#5367c8" stroke-width="5" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <circle cx="105" cy="286" r="24" fill="#fff" stroke="#8796a9" stroke-width="4"/><circle cx="236" cy="286" r="24" fill="#fff" stroke="#8796a9" stroke-width="4"/><circle cx="318" cy="205" r="24" fill="#fff" stroke="#5367c8" stroke-width="4"/><circle cx="382" cy="205" r="24" fill="#fff" stroke="#5367c8" stroke-width="4"/><circle cx="382" cy="286" r="24" fill="#fff" stroke="#17877c" stroke-width="4"/>
    <circle cx="666" cy="286" r="24" fill="#fff" stroke="#8796a9" stroke-width="4"/><circle cx="770" cy="286" r="24" fill="#fff" stroke="#8796a9" stroke-width="4"/><circle cx="860" cy="286" r="24" fill="#fff" stroke="#17877c" stroke-width="4"/><circle cx="956" cy="286" r="24" fill="#fff" stroke="#5367c8" stroke-width="4"/><circle cx="1030" cy="286" r="24" fill="#fff" stroke="#5367c8" stroke-width="4"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#26364b"><text x="105" y="291">A</text><text x="236" y="291">B</text><text x="318" y="210">C</text><text x="382" y="210">D</text><text x="382" y="291">E</text><text x="666" y="291">A</text><text x="770" y="291">B</text><text x="860" y="291">E</text><text x="956" y="291">C′</text><text x="1030" y="291">D′</text></g>
  <rect x="350" y="322" width="70" height="28" rx="14" fill="#e3f5f1"/><text x="385" y="341" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#14766e">main</text>
  <rect x="304" y="154" width="145" height="28" rx="14" fill="#e9ecff"/><text x="376" y="173" font-family="Arial,'Malgun Gothic',sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#4557b4">feature</text>
  <rect x="825" y="322" width="70" height="28" rx="14" fill="#e3f5f1"/><text x="860" y="341" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#14766e">main</text>
  <rect x="925" y="232" width="125" height="28" rx="14" fill="#e9ecff"/><text x="987" y="251" font-family="Arial,'Malgun Gothic',sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#4557b4">feature</text>
  <path d="M520 260H575" stroke="#8391a4" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="70" y="388" font-family="Arial,'Malgun Gothic',sans-serif" font-size="12" fill="#728096">C, D는 B에서 갈라진 커밋</text>
  <text x="631" y="388" font-family="Arial,'Malgun Gothic',sans-serif" font-size="12" fill="#728096">C′, D′는 E 위에 다시 만든 새 커밋</text>
  <text x="631" y="412" font-family="Arial,'Malgun Gothic',sans-serif" font-size="12" fill="#728096">내용이 같아도 커밋 ID는 달라집니다</text>
</svg>
