<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif">

  <text x="24" y="28" font-size="15" font-weight="700" fill="#808080">3시간으로 묶을 때 경계를 어느 쪽에 붙이는가</text>
  <text x="24" y="50" font-size="12" fill="#808080">0시부터 6시까지 시간별 값 0~6. 같은 데이터인데 closed 하나로 구간이 통째로 밀립니다.</text>

  <!-- 눈금 -->
  <g font-size="11" fill="#808080" text-anchor="middle">
    <text x="120" y="86">00시</text><text x="200" y="86">01시</text><text x="280" y="86">02시</text>
    <text x="360" y="86">03시</text><text x="440" y="86">04시</text><text x="520" y="86">05시</text>
    <text x="600" y="86">06시</text>
  </g>
  <g font-size="11.5" font-weight="700" fill="#808080" text-anchor="middle">
    <text x="120" y="106">0</text><text x="200" y="106">1</text><text x="280" y="106">2</text>
    <text x="360" y="106">3</text><text x="440" y="106">4</text><text x="520" y="106">5</text>
    <text x="600" y="106">6</text>
  </g>
  <g fill="#808080" fill-opacity="0.5">
    <circle cx="120" cy="118" r="3.5"/><circle cx="200" cy="118" r="3.5"/><circle cx="280" cy="118" r="3.5"/>
    <circle cx="360" cy="118" r="3.5"/><circle cx="440" cy="118" r="3.5"/><circle cx="520" cy="118" r="3.5"/>
    <circle cx="600" cy="118" r="3.5"/>
  </g>

  <!-- ── closed='left' (기본) ── -->
  <text x="24" y="152" font-size="13" font-weight="700" fill="#3FB6A8">closed='left' — 기본값</text>
  <text x="248" y="152" font-size="11.5" fill="#808080">왼쪽 끝을 포함하고 오른쪽 끝은 뺀다</text>

  <g>
    <rect x="88" y="162" width="240" height="40" rx="5" fill="#3FB6A8" fill-opacity="0.25" stroke="#3FB6A8" stroke-opacity="0.6"/>
    <text x="208" y="187" font-size="12" text-anchor="middle" fill="#808080">[00:00, 03:00) → 0+1+2 = 3</text>
    <rect x="328" y="162" width="240" height="40" rx="5" fill="#3FB6A8" fill-opacity="0.25" stroke="#3FB6A8" stroke-opacity="0.6"/>
    <text x="448" y="187" font-size="12" text-anchor="middle" fill="#808080">[03:00, 06:00) → 3+4+5 = 12</text>
    <rect x="568" y="162" width="120" height="40" rx="5" fill="#3FB6A8" fill-opacity="0.25" stroke="#3FB6A8" stroke-opacity="0.6"/>
    <text x="628" y="187" font-size="12" text-anchor="middle" fill="#808080">06:00 → 6</text>
  </g>

  <!-- ── closed='right' ── -->
  <text x="24" y="248" font-size="13" font-weight="700" fill="#F0A04B">closed='right'</text>
  <text x="248" y="248" font-size="11.5" fill="#808080">오른쪽 끝을 포함하고 왼쪽 끝은 뺀다</text>

  <g>
    <rect x="40" y="258" width="120" height="40" rx="5" fill="#F0A04B" fill-opacity="0.28" stroke="#F0A04B" stroke-opacity="0.65"/>
    <text x="100" y="283" font-size="12" text-anchor="middle" fill="#808080">00:00 → 0</text>
    <rect x="160" y="258" width="240" height="40" rx="5" fill="#F0A04B" fill-opacity="0.28" stroke="#F0A04B" stroke-opacity="0.65"/>
    <text x="280" y="283" font-size="12" text-anchor="middle" fill="#808080">(00:00, 03:00] → 1+2+3 = 6</text>
    <rect x="400" y="258" width="240" height="40" rx="5" fill="#F0A04B" fill-opacity="0.28" stroke="#F0A04B" stroke-opacity="0.65"/>
    <text x="520" y="283" font-size="12" text-anchor="middle" fill="#808080">(03:00, 06:00] → 4+5+6 = 15</text>
  </g>

  <text x="40" y="316" font-size="10.5" fill="#808080">↑ 이 구간의 라벨은 전날 21:00 입니다</text>

  <rect x="24" y="328" width="752" height="40" rx="6" fill="#E05C5C" fill-opacity="0.12" stroke="#E05C5C" stroke-opacity="0.45"/>
  <text x="40" y="353" font-size="12.5" fill="#808080">합계는 양쪽 다 <tspan font-weight="700">21</tspan> 로 같습니다 — 총합 검산으로는 이 차이가 드러나지 않습니다.</text>
</svg>
