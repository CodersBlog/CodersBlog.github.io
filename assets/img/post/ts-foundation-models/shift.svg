<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" height="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif">

  <text x="24" y="28" font-size="15" font-weight="700" fill="#808080">시계열 예측에서 학습이 놓이는 자리가 바뀌었다</text>
  <text x="24" y="50" font-size="12" fill="#808080">모델을 데이터에 맞추던 것에서, 데이터를 이미 학습된 모델에 넣는 쪽으로.</text>

  <line x1="400" y1="70" x2="400" y2="356" stroke="#808080" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>

  <!-- ══ 왼쪽: 기존 ══ -->
  <text x="24" y="92" font-size="13.5" font-weight="700" fill="#5B8DEF">데이터셋마다 새로 학습</text>

  <g font-size="11" text-anchor="middle">
    <!-- A -->
    <rect x="30" y="112" width="82" height="30" rx="5" fill="#5B8DEF" fill-opacity="0.25" stroke="#5B8DEF" stroke-opacity="0.5"/>
    <text x="71" y="131" fill="#808080">데이터셋 A</text>
    <rect x="152" y="112" width="62" height="30" rx="5" fill="#E05C5C" fill-opacity="0.3" stroke="#E05C5C" stroke-opacity="0.55"/>
    <text x="183" y="131" fill="#808080">학습</text>
    <rect x="254" y="112" width="82" height="30" rx="5" fill="#5B8DEF" fill-opacity="0.6"/>
    <text x="295" y="131" fill="#ffffff">모델 A</text>
    <!-- B -->
    <rect x="30" y="164" width="82" height="30" rx="5" fill="#5B8DEF" fill-opacity="0.25" stroke="#5B8DEF" stroke-opacity="0.5"/>
    <text x="71" y="183" fill="#808080">데이터셋 B</text>
    <rect x="152" y="164" width="62" height="30" rx="5" fill="#E05C5C" fill-opacity="0.3" stroke="#E05C5C" stroke-opacity="0.55"/>
    <text x="183" y="183" fill="#808080">학습</text>
    <rect x="254" y="164" width="82" height="30" rx="5" fill="#5B8DEF" fill-opacity="0.6"/>
    <text x="295" y="183" fill="#ffffff">모델 B</text>
    <!-- C -->
    <rect x="30" y="216" width="82" height="30" rx="5" fill="#5B8DEF" fill-opacity="0.25" stroke="#5B8DEF" stroke-opacity="0.5"/>
    <text x="71" y="235" fill="#808080">데이터셋 C</text>
    <rect x="152" y="216" width="62" height="30" rx="5" fill="#E05C5C" fill-opacity="0.3" stroke="#E05C5C" stroke-opacity="0.55"/>
    <text x="183" y="235" fill="#808080">학습</text>
    <rect x="254" y="216" width="82" height="30" rx="5" fill="#5B8DEF" fill-opacity="0.6"/>
    <text x="295" y="235" fill="#ffffff">모델 C</text>
  </g>

  <g stroke="#808080" stroke-width="1.2" stroke-opacity="0.55" fill="none">
    <path d="M112 127 L146 127"/><path d="M214 127 L248 127"/>
    <path d="M112 179 L146 179"/><path d="M214 179 L248 179"/>
    <path d="M112 231 L146 231"/><path d="M214 231 L248 231"/>
  </g>

  <rect x="24" y="268" width="352" height="58" rx="6" fill="#E05C5C" fill-opacity="0.12" stroke="#E05C5C" stroke-opacity="0.45"/>
  <text x="40" y="291" font-size="12.5" font-weight="700" fill="#808080">→ 데이터가 적으면 시작조차 못 한다</text>
  <text x="40" y="312" font-size="11.5" fill="#808080">새 도메인이 생길 때마다 학습을 처음부터 다시</text>

  <!-- ══ 오른쪽: 파운데이션 ══ -->
  <text x="424" y="92" font-size="13.5" font-weight="700" fill="#3FB6A8">한 번 사전학습, 이후에는 추론만</text>

  <rect x="452" y="110" width="296" height="30" rx="5" fill="#A66BBE" fill-opacity="0.3" stroke="#A66BBE" stroke-opacity="0.6"/>
  <text x="600" y="129" font-size="11" text-anchor="middle" fill="#808080">여러 도메인의 대규모 시계열 말뭉치</text>

  <rect x="518" y="166" width="164" height="34" rx="5" fill="#3FB6A8"/>
  <text x="600" y="188" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">사전학습된 모델 하나</text>

  <g stroke="#808080" stroke-width="1.2" stroke-opacity="0.55" fill="none">
    <path d="M600 140 L600 162"/>
  </g>
  <path d="M596 154 L600 166 L604 154 Z" fill="#808080" fill-opacity="0.6"/>

  <g stroke="#3FB6A8" stroke-width="1.3" stroke-opacity="0.75" fill="none">
    <path d="M600 200 L470 216"/><path d="M600 200 L600 216"/><path d="M600 200 L730 216"/>
  </g>

  <g font-size="11" text-anchor="middle">
    <rect x="428" y="216" width="84" height="30" rx="5" fill="#5B8DEF" fill-opacity="0.25" stroke="#5B8DEF" stroke-opacity="0.5"/>
    <text x="470" y="235" fill="#808080">데이터셋 A</text>
    <rect x="558" y="216" width="84" height="30" rx="5" fill="#5B8DEF" fill-opacity="0.25" stroke="#5B8DEF" stroke-opacity="0.5"/>
    <text x="600" y="235" fill="#808080">데이터셋 B</text>
    <rect x="688" y="216" width="84" height="30" rx="5" fill="#5B8DEF" fill-opacity="0.25" stroke="#5B8DEF" stroke-opacity="0.5"/>
    <text x="730" y="235" fill="#808080">데이터셋 C</text>
  </g>

  <text x="600" y="260" font-size="11" text-anchor="middle" fill="#3FB6A8">학습 없이 넣기만 한다 — 제로샷</text>

  <rect x="424" y="268" width="352" height="58" rx="6" fill="#3FB6A8" fill-opacity="0.12" stroke="#3FB6A8" stroke-opacity="0.45"/>
  <text x="440" y="291" font-size="12.5" font-weight="700" fill="#808080">→ 처음 보는 데이터도 바로 예측한다</text>
  <text x="440" y="312" font-size="11.5" fill="#808080">다만 항상 전용 모델보다 낫다는 뜻은 아니다</text>

  <text x="24" y="350" font-size="11" fill="#808080">※ 두 방식의 차이만 남겨 그린 개념도입니다. 특정 논문의 그림이 아닙니다.</text>
  <text x="24" y="366" font-size="11" fill="#808080">   실무에서는 사전학습 모델을 받아 해당 도메인에 파인튜닝하는 중간 형태도 함께 쓰입니다.</text>
</svg>
